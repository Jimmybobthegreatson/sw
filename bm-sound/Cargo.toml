[package]
name = "bm-sound"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Real output device through cpal. Without it only the headless renderer is available.
device = ["dep:cpal"]

[dependencies]
bm-vfs = { path = "../bm-vfs" }
bm-formats = { path = "../bm-formats" }
bm-models = { path = "../bm-models" }
symphonia = { version = "0.5", default-features = false, features = ["wav", "ogg", "vorbis", "flac", "pcm", "adpcm"] }
cpal = { version = "0.18", optional = true }
log = "0.4"
thiserror = "2"

[dev-dependencies]
env_logger = "0.11"
