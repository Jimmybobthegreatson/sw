[package]
name = "bm-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
bm-vfs = { path = "../bm-vfs" }
bm-formats = { path = "../bm-formats" }
bm-render = { path = "../bm-render" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
log = "0.4"
thiserror = "2"
png = "0.18.1"
pollster = "0.4"

[dev-dependencies]
env_logger = "0.11"
