[package]
name = "bm-game"
version = "0.1.0"
edition = "2024"

[dependencies]
bm-vfs = { path = "../bm-vfs" }
bm-formats = { path = "../bm-formats" }
bm-models = { path = "../bm-models" }
bm-sound = { path = "../bm-sound" }
bm-music = { path = "../bm-music" }
bm-particles = { path = "../bm-particles", default-features = false }
bm-script = { path = "../bm-script" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
log = "0.4"
thiserror = "2"

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
