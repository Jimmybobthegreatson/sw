[workspace]
resolver = "2"
members = ["bm-vfs", "bm-formats", "bm-models", "bm-render", "bm-particles", "bm-sound", "bm-music", "bm-ui", "bm-script", "bm-game", "bm-app", "bm-bevy"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Parsing real game files in unoptimised test builds is painfully slow.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
debug = false
strip = true
