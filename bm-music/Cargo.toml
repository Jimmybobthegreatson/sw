[package]
name = "bm-music"
version = "0.1.0"
edition = "2024"

[dependencies]
bm-vfs = { path = "../bm-vfs" }
bm-sound = { path = "../bm-sound" }
bm-models = { path = "../bm-models" }
bm-formats = { path = "../bm-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
log = "0.4"
thiserror = "2"

[features]
default = []
# Real output device (cpal) for the `music_play` example.
device = ["bm-sound/device"]


[[example]]
name = "music_play"
required-features = ["device"]
